<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a73e8, #0b3d91);
            min-height: 100vh; margin: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: #fff; padding: 32px 36px; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.25);
            width: 100%; max-width: 420px;
        }
        h1 { text-align: center; color: #0b3d91; margin-top: 0; font-size: 22px; }
        label { display: block; margin: 14px 0 4px; font-weight: 600; color: #333; font-size: 14px; }
        input {
            width: 100%; padding: 10px 12px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 15px;
        }
        input:focus { border-color: #1a73e8; outline: none; }
        .botoes { display: flex; gap: 10px; margin-top: 22px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .cadastrar { background: #1a73e8; color: #fff; }
        .cadastrar:hover { background: #1559b0; }
        .limpar { background: #e8eaed; color: #333; }
        .limpar:hover { background: #dadce0; }
    </style>
</head>
<body>
    <form class="card" action="cliente" method="POST">
        <h1>Cadastro de Cliente</h1>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: João da Silva" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Ex.: joao@email.com" required>

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" placeholder="Ex.: 25" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Ex.: (11) 99999-9999">

        <div class="botoes">
            <button type="submit" class="cadastrar">Cadastrar</button>
            <button type="reset" class="limpar">Limpar</button>
        </div>
    </form>
</body>
</html>
